[package]
name = "flowerbox"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20", features = ["serialize", "wav"] }
avian3d = "0.8"
leafwing-input-manager = "0.22"
bevy-inspector-egui = { version = "0.38", optional = true }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
data-encoding = "2"
arboard = "3"
iroh = "1.4"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
ron = "0.12"
dirs = "6"

[features]
# `cargo run --features dev` → faster incremental builds + inspector
dev = ["bevy/dynamic_linking", "dep:bevy-inspector-egui"]

# Small optimisation for our code, full for dependencies (Bevy is slow in pure debug).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
# Release builds ship to friends: no debug symbols (the binary shrinks a lot).
strip = true
